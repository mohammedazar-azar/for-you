<html>
    <head>

    <body>
        <style>
            html,body{
                overflow: hidden;
                background-color: #161616;
                transform:scale(1.5);
            }
            .b
            {
                background-color:#fff;
                text-align: center;
                margin-top: 30px;
                margin-left: 650px;
                width: 100px;
                height: 30px;
                border: none;
                outline: none;
                cursor: pointer;
                position:relative;
                z-index: 0;
                border-radius: 12px;
            }
            .b::after{
                content:"";
                z-index: -1;
                position: absolute;
            background-color: #333;
            left:0;
            top: 0;
            border-radius: 10px;

            }
            .b::before{
                content: "";
                background: linear-gradient(45deg,#ff0000,#ff7300,#fffb00,#48ff00,#00ffd5,#002bff,#ff00cb,#ff0000);
              position: absolute;
              z-index: -1;
               background-size: 600%;
            left:-2px;
            top: -2px;
            width: calc(100% + 4px);
            height: calc(100% + 4px);
            filter: blur(8px);
            
            animation: glowing 20s linear infinite;
            transition: opacity.3s ease-in-out;
            border-radius: 10px;
            opacity: 1;

            }
            @keyframes glowing{
                0%{
                    background-position: 0,0; }
                    50%{ background-position: 400%,0;}
                    100%{ background-position: 0,0;}
                }
            .b:hover::before{
                opacity: 1;
            }
            .b:active:after{
                background: transparent;
            }
            .b:active{
                color: #000;
                font-weight: bold;
            }
            .a
            {
                margin-top: 100px;
                margin-left: 300px;
                border-color:2px solid black;
                background-color: rgb(98, 150, 98);
                color: black;
                
            }
        </style>

    </body>
<table border="2" class="a">

<tr><th>DOB</th><td><input type="datetime-local" required></td></tr>

</table>
